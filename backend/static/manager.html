<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del gerente</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1d2733; --muted:#5b6876; --line:#d8dee5; --accent:#0b5cad; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px; }
  header h1 { margin:0; font-size:1.25rem; }
  header a { color:#fff; font-size:.9rem; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1.05rem; margin:0 0 12px; }
  form.grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:12px; align-items:end; }
  label { display:flex; flex-direction:column; font-size:.85rem; color:var(--muted); gap:4px; }
  input { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  button { font:inherit; padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .big { font-size:2.5rem; font-weight:700; margin:4px 0; font-variant-numeric: tabular-nums; }
  .muted { color:var(--muted); }
  .err { color:var(--err); }
  .hidden { display:none; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip { background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:16px; padding:5px 12px; font-size:.85rem; }
  .chip:hover { background:#eaf1fa; }
  .helper { margin-top:12px; font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Panel del gerente</h1>
  <a href="/">Volver a reservas</a>
</header>
<main>
  <section class="card">
    <h2>Ocupación por ruta y mes</h2>
    <form id="manager-form" class="grid">
      <label>Ruta
        <input data-testid="manager-route" id="route" placeholder="BOG-MDE" list="routes" autocomplete="off" required>
      </label>
      <label>Mes
        <input data-testid="manager-month" id="month" placeholder="AAAA-MM" list="months" autocomplete="off" required>
      </label>
      <button data-testid="manager-load" type="submit">Consultar</button>
    </form>
    <datalist id="routes"></datalist>
    <datalist id="months"></datalist>
    <div id="routes-box" class="helper hidden">Rutas con historia (haz clic para escoger una):
      <div id="route-chips" class="chips"></div>
    </div>
    <p id="months-hint" class="helper hidden"></p>
    <p id="msg" class="muted"></p>
  </section>

  <section id="result-card" class="card hidden">
    <p class="muted" id="result-title"></p>
    <p class="big"><span data-testid="occupancy-value" id="occupancy"></span></p>
    <p class="muted" id="detail"></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function niceMonth(ym) { const [y, m] = ym.split("-"); return `${MESES[parseInt(m) - 1]} de ${y}`; }

// ---------- ayudas: rutas y meses que existen en Athena ----------
async function loadCatalog() {
  try {
    const res = await fetch("/analytics/catalog");
    if (!res.ok) return;
    const c = await res.json();
    for (const [id, values] of [["routes", c.routes], ["months", c.months]]) {
      $(id).innerHTML = "";
      for (const v of values) { const o = document.createElement("option"); o.value = v; $(id).appendChild(o); }
    }
    const box = $("route-chips");
    box.innerHTML = "";
    for (const r of c.routes) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = r;
      b.addEventListener("click", () => { $("route").value = r; $("month").focus(); });
      box.appendChild(b);
    }
    $("routes-box").classList.toggle("hidden", c.routes.length === 0);
    if (c.months.length) {
      $("months-hint").textContent = `Meses disponibles: de ${niceMonth(c.months[0])} a ${niceMonth(c.months[c.months.length - 1])}.`;
      $("months-hint").classList.remove("hidden");
    }
  } catch (e) { /* las ayudas son opcionales */ }
}
loadCatalog();

$("manager-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const route = $("route").value.trim().toUpperCase();
  const month = $("month").value.trim();
  const btn = e.submitter || document.querySelector('[data-testid="manager-load"]');
  btn.disabled = true;
  $("result-card").classList.add("hidden");
  $("occupancy").textContent = "";
  $("msg").className = "muted";
  $("msg").textContent = "Consultando Athena... puede tardar unos segundos.";
  try {
    const res = await fetch("/analytics/occupancy?" + new URLSearchParams({ route, month }));
    if (res.status === 404) throw new Error("No hay datos para esa ruta y mes.");
    if (!res.ok) throw new Error("No se pudo consultar (código " + res.status + ").");
    const d = await res.json();
    // Se muestran 2 decimales del porcentaje: el error maximo es 0.005 puntos (0.00005 en fraccion).
    $("occupancy").textContent = (d.occupancy * 100).toFixed(2) + "%";
    $("result-title").textContent = `${d.route} · ${niceMonth(d.month)}`;
    $("detail").textContent = `${d.seats_sold.toLocaleString("es-CO")} sillas vendidas de ${d.seats_capacity.toLocaleString("es-CO")} disponibles`;
    $("result-card").classList.remove("hidden");
    $("msg").textContent = "";
  } catch (err) {
    $("msg").className = "err";
    $("msg").textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
